services:
  app:
    build:
      context: .
      dockerfile: build/app/Dockerfile
    container_name: filestream-app
    restart: always
    volumes:
      - ./applications:/var/www/html
      - /var/www/html/vendor
    networks:
      - filestream-network
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 256M

  db:
    image: mariadb:10.11
    container_name: filestream-db
    restart: always
    environment:
      MARIADB_DATABASE: filestream
      MARIADB_USER: filestream_user
      MARIADB_PASSWORD: filestream_password
      MARIADB_ROOT_PASSWORD: root_password
    volumes:
      - ./data/db:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - filestream-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:stable-alpine
    container_name: filestream-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./applications:/var/www/html
      - ./build/nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - filestream-network
    depends_on:
      app:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M

  scheduler:
    build:
      context: .
      dockerfile: build/app/Dockerfile
    container_name: filestream-scheduler
    restart: always
    volumes:
      - ./applications:/var/www/html
      - /var/www/html/vendor
    networks:
      - filestream-network
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    command: ["php", "artisan", "schedule:work"]
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 256M

networks:
  filestream-network:
    driver: bridge

